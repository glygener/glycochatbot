name: glygen

services:
  chromadb:
    image: chromadb/chroma:0.6.3
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    depends_on:
      chromadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      PDF_PATH: /app/data/converted/glycobiology.txt
      DATA_DIR: /app/data
    volumes:
      - ./data/converted:/app/data/converted:ro
      - hf_cache:/root/.cache/huggingface
    command: python -m Ingestion.pipeline
    restart: "no"

volumes:
  chroma_data:
    name: glygen_chroma_data
  hf_cache:
