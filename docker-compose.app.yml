name: glygen

services:
  chromadb:
    image: chromadb/chroma:0.6.3
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    depends_on:
      chromadb:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      DATA_DIR: /app/data
    volumes:
      - chat_data:/app/data
      - hf_cache:/root/.cache/huggingface
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      GLYGEN_API_URL: http://backend:8000

volumes:
  chroma_data:
    name: glygen_chroma_data
  chat_data:
  hf_cache:
